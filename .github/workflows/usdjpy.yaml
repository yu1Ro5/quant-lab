name: USDJPY Hourly Monitor

on:
  schedule:
    # GitHub Actions cron schedules use UTC.
    # UTC Monday 00:17–Friday 23:17
    # JST Monday 09:17–Saturday 08:17
    - cron: "17 * * * 1-5"

  workflow_dispatch:

concurrency:
  group: usdjpy-hourly-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
      USD_JPY_ALERT_THRESHOLD_PERCENT: ${{ vars.USD_JPY_ALERT_THRESHOLD_PERCENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Run script
        run: uv run python main.py

      - name: Persist CSV history
        if: ${{ always() }}
        run: |
          if [ ! -f data/usd_jpy.csv ]; then
            echo "No CSV history file generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usd_jpy.csv

          if git diff --cached --quiet; then
            echo "No CSV history changes to commit."
            exit 0
          fi

          git commit -m "Update USD/JPY rate history"
          git push
