name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node for chart controller tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify stock library imports
        run: uv run --locked python -c "import moomoo; import plotly; import kaleido"

      - name: Run ruff
        run: uv run --locked ruff check .

      - name: Run mypy
        run: uv run --locked mypy .

      - name: Run unittest without skips
        run: |
          uv run --locked python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover('.')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
