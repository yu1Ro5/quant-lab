[project]
name = "quant-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=2.3.0",
    "pyarrow>=20.0.0",
    "requests>=2.34.2",
    "slack-sdk>=3.33.0",
    "yfinance>=1.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_lab"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=2.3.0",
    "ruff>=0.16.0",
    "types-requests>=2.33.0.20260712",
]
