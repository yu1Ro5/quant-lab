[project]
name = "quant-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.11",
    "kaleido>=1.0",
    "moomoo-api>=10.12.7208",
    "numpy>=2.5.1",
    "pandas>=2.3.0",
    "plotly>=6.1.1",
    "pyarrow>=20.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "yfinance>=1.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_lab"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=2.3.0",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20261113",
]
